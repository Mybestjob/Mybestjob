<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  :root{
    --bg:#F6F2E9; --card:#fff; --ink:#221F3D; --sub:#8A8496;
    --navy:#28298B; --navySoft:#E7E7F4; --red:#C44536; --redSoft:#F8E6E2;
    --gold:#CFAD62; --goldDeep:#A87E27; --goldSoft:#F7EEDA; --line:#E8E0D0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Cairo','Tajawal','Segoe UI',Tahoma,system-ui,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom)}
  input,select,button,textarea{font-family:inherit}
  input::placeholder,textarea::placeholder{color:var(--sub)}
  input:focus,button:focus-visible,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:2px}
  .wrap{max-width:480px;margin:0 auto}
  .pad{padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .btn{width:100%;padding:13px;border:none;border-radius:13px;font-weight:800;font-size:16px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:disabled{opacity:.6}
  .navy{background:var(--navy)} .red{background:var(--red)}
  .ghost{background:var(--card);color:var(--goldDeep);border:1.5px solid var(--gold)}
  .inp{width:100%;padding:12px;font-size:15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
  .lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:7px}
  .field{margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--card)}
  .chip{padding:7px 16px;border-radius:20px;cursor:pointer;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:17px}
  .catbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .ic{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:18px}
  .ltr{direction:ltr;text-align:right}
  .muted{color:var(--sub)}
  .brandbar{background:var(--navy);border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:11px}
  .banner{background:var(--goldSoft);border:1px solid var(--gold);color:var(--goldDeep);border-radius:14px;padding:10px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .banner button{background:var(--goldDeep);color:#fff;border:none;border-radius:9px;padding:7px 11px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  #report{display:none}
  @media print{ #app{display:none!important} #report{display:block!important} @page{margin:14mm} }
  table{width:100%;border-collapse:collapse}
  .tcell{padding:7px 8px;border-bottom:1px solid #ddd;font-size:12.5px}
  .th{padding:7px 8px;border-bottom:2px solid var(--navy);background:var(--navySoft);font-size:12.5px;font-weight:800;text-align:right}
</style>
</head>

<div id="app"></div>
<div id="report"></div>

/* ================= STORE ================= */
/* Local backend (this device) + optional Firebase cloud backend (team sync). */
let fb=null, db=null, unsub=null;
function cloudOn(){ return !!localStorage.getItem("fb-config"); }

function loadFirebase(){
  return new Promise((res,rej)=>{
    if(window.firebase&&window.firebase.firestore) return res();
    const a=document.createElement("script");
    a.src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
    a.onload=()=>{const b=document.createElement("script");
      b.src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js";
      b.onload=res;b.onerror=rej;document.head.appendChild(b);};
    a.onerror=rej;document.head.appendChild(a);
  });
}
async function initCloud(){
  const cfg=JSON.parse(localStorage.getItem("fb-config"));
  await loadFirebase();
  if(!window.firebase.apps.length) fb=window.firebase.initializeApp(cfg); else fb=window.firebase.app();
  db=window.firebase.firestore();
}

const Store={
  // meta
  async getMeta(code){
    if(cloudOn()){ const d=await db.collection("trips").doc(code).get(); return d.exists?d.data():null; }
    const raw=localStorage.getItem("meta:"+code); return raw?JSON.parse(raw):null;
  },
  async setMeta(code,meta){
    if(cloudOn()){ await db.collection("trips").doc(code).set(meta,{merge:true}); return; }
    localStorage.setItem("meta:"+code,JSON.stringify(meta));
  },
  async listPeople(code){
    if(cloudOn()){ const s=await db.collection("trips").doc(code).collection("people").get();
      const o={}; s.forEach(d=>o[d.id]=(d.data().list||[])); return o; }
    const o={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
      const p="txns:"+code+":"; if(k.startsWith(p)) o[k.slice(p.length)]=JSON.parse(localStorage.getItem(k));}
    return o;
  },
  async savePerson(code,name,list){
    if(cloudOn()){ await db.collection("trips").doc(code).collection("people").doc(name).set({list}); return; }
    localStorage.setItem("txns:"+code+":"+name,JSON.stringify(list));
  },
  subscribe(code,cb){ // realtime in cloud mode only
    if(!cloudOn()) return;
    if(unsub){unsub();unsub=null;}
    unsub=db.collection("trips").doc(code).collection("people").onSnapshot(s=>{
      const o={}; s.forEach(d=>o[d.id]=(d.data().list||[])); cb(o);
    });
  }
};

function allTxns(){const o=[];Object.entries(S.byPerson).forEach(([n,l])=>(l||[]).forEach(t=>o.push({...t,by:n})));return o;}
function isAdmin(){return S.me&&S.me.role==="admin";}

async function refreshData(){
  if(!S.me) return;
  S.syncing=true; render();
  try{ S.byPerson=await Store.listPeople(S.me.code); }catch(e){}
  S.syncing=false; render();
}

function render(){
  if(S.phase==="loading"){ app.innerHTML=`<div class="wrap pad"></div>`; return; }

  if(S.phase==="join")    return join();
  if(S.phase==="settings")return settings();
  return main();
}

/* ================= ACTIONS ================= */
async function go(phase){S.err="";S.phase=phase;render();}

document.addEventListener("click",async(e)=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action;
  if(a==="go-create") return go("create");
  if(a==="go-join") return go("join");
  if(a==="go-welcome") return go("welcome");
  if(a==="back-main") return go("main");
  if(a==="open-settings") return go("settings");
  if(a==="toggle-jadmin"){S.jAdmin=!S.jAdmin;render();return;}
  if(a==="type-out"){S.type="out";S.cat="restaurant";render();return;}
  if(a==="type-in"){S.type="in";S.cat="games";render();return;}
  if(a==="set-cat"){S.cat=el.dataset.cat;render();return;}
  if(a==="filter"){S.filterType=el.dataset.f;render();return;}
  if(a==="edit-tripname"){S.editName=true;render();return;}
  if(a==="export-pdf"){buildReport();window.print();return;}
  if(a==="refresh"){refreshData();return;}

  if(a==="save-tripname"){const v=document.getElementById("tripName").value.trim()||S.meta.tripName;
    S.meta={...S.meta,tripName:v};S.editName=false;await Store.setMeta(S.me.code,S.meta);render();return;}

  if(a==="do-create"){
    const trip=val("cTrip"),name=val("cName"),cur=val("cCur"),pin=val("cPin");
    if(!trip||!name||pin.length<4){S.err="عبّئ الحقول، والرمز 4 أرقام أو أكثر.";render();return;}
    const code=genCode();
    S.meta={tripName:trip,currency:cur,pinHash:hashPin(pin)};
    S.me={code,name,role:"admin"};S.byPerson={};S.filterPerson="__all__";
    await Store.setMeta(code,S.meta);
    localStorage.setItem("me",JSON.stringify(S.me));
    afterLogin();return;
  }
  if(a==="do-join"){
    const code=cleanCode(val("jCode")),name=val("jName").trim();
    if(code.length!==6||!name){S.err="تأكد من الكود واسمك.";render();return;}
    let m=null; try{m=await Store.getMeta(code);}catch(err){}
    if(!m){S.err=cloudOn()?"ما في رحلة بهذا الكود.":"غير موجودة على هذا الجهاز. فعّل المزامنة للانضمام عبر الأجهزة.";render();return;}
    if(S.jAdmin&&hashPin(val("jPin"))!==m.pinHash){S.err="رمز الأدمن غير صحيح.";render();return;}
    S.meta=m;S.me={code,name,role:S.jAdmin?"admin":"staff"};S.filterPerson=S.jAdmin?"__all__":name;
    localStorage.setItem("me",JSON.stringify(S.me));
    afterLogin();return;
  }
  if(a==="copy-code"){try{await navigator.clipboard.writeText(S.me.code);el.textContent="✓ "+S.me.code;setTimeout(render,1200);}catch(err){}return;}
  if(a==="sign-out"){localStorage.removeItem("me");if(unsub){unsub();unsub=null;}S.me=null;S.byPerson={};go("welcome");return;}
  if(a==="del-txn"){const id=Number(el.dataset.id),by=el.dataset.by;
    const lst=(S.byPerson[by]||[]).filter(x=>x.id!==id);S.byPerson={...S.byPerson,[by]:lst};
    await Store.savePerson(S.me.code,by,lst);render();return;}
  if(a==="add-txn"){
    const v=parseFloat(val("amt"));if(!v||v<=0)return;
    const t={id:Date.now(),type:S.type,cat:S.cat,amount:v,note:val("note").trim(),date:val("dt")||today()};
    const mine=[...(S.byPerson[S.me.name]||[]),t];
    S.byPerson={...S.byPerson,[S.me.name]:mine};
    await Store.savePerson(S.me.code,S.me.name,mine);render();return;}

  if(a==="save-config"){
    const raw=val("cfg");let obj=null;
    try{const m=raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1);obj=Function("return ("+m+")")();}catch(err){}
    if(!obj||!obj.projectId||!obj.apiKey){S.err="الإعداد غير صحيح. الصق كائن firebaseConfig كاملاً.";render();return;}
    localStorage.setItem("fb-config",JSON.stringify(obj));
    try{await initCloud();}catch(err){localStorage.removeItem("fb-config");S.err="تعذّر الاتصال. تأكد من الإعداد والإنترنت.";render();return;}
    S.err="";go(S.me?"main":"welcome");if(S.me){Store.subscribe(S.me.code,d=>{S.byPerson=d;render();});refreshData();}return;
  }
  if(a==="disconnect"){localStorage.removeItem("fb-config");if(unsub){unsub();unsub=null;}location.reload();return;}
});

document.addEventListener("change",async(e)=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  if(el.dataset.action==="change-cur"){S.meta={...S.meta,currency:el.value};await Store.setMeta(S.me.code,S.meta);render();}
  if(el.dataset.action==="change-fperson"){S.filterPerson=el.value;render();}
});

function val(id){const el=document.getElementById(id);return el?el.value:"";}

async function afterLogin(){
  if(cloudOn()){ try{S.byPerson=await Store.listPeople(S.me.code);}catch(e){}
    Store.subscribe(S.me.code,d=>{S.byPerson=d;render();}); }
  else { try{S.byPerson=await Store.listPeople(S.me.code);}catch(e){} }
  go("main");
}

      <tbody>${per.map(p=>`<tr><td class="tcell">${esc(p.name)}</td><td class="tcell ltr">${fmt(p.inc)}</td><td class="tcell ltr">${fmt(p.out)}</td><td class="tcell ltr" style="font-weight:700">${fmt(p.net)}</td></tr>`).join("")}</tbody></table>`:""}
    <h2 style="font-size:15px;font-weight:800;margin:0 0 6px">كل الحركات</h2>
    <table><thead><tr><th class="th">التاريخ</th><th class="th">المشرف</th><th class="th">البند</th><th class="th">النوع</th><th class="th">ملاحظة</th><th class="th">المبلغ</th></tr></thead>
    <tbody>${txns.map(x=>`<tr><td class="tcell">${fdate(x.date)}</td><td class="tcell">${esc(x.by)}</td><td class="tcell">${(CAT[x.cat]||["","أخرى"])[1]}</td><td class="tcell">${x.type==="in"?"مقبوض":"مدفوع"}</td><td class="tcell">${esc(x.note)||"—"}</td><td class="tcell ltr" style="font-weight:700">${x.type==="out"?"−":"+"}${S.meta.currency}${fmt(x.amount)}</td></tr>`).join("")}</tbody></table>
  </div>`;
}

/* ================= INIT ================= */
(async function(){
  try{ if(cloudOn()) await initCloud(); }catch(e){}
  let saved=null; try{saved=JSON.parse(localStorage.getItem("me"));}catch(e){}
  if(saved&&saved.code&&saved.name){
    S.me=saved; S.filterPerson=saved.role==="admin"?"__all__":saved.name;
    try{ const m=await Store.getMeta(saved.code); if(m) S.meta=m; }catch(e){}
    try{ S.byPerson=await Store.listPeople(saved.code); }catch(e){}
    if(cloudOn()) Store.subscribe(saved.code,d=>{S.byPerson=d;render();});
    S.phase="main";
  } else S.phase="welcome";
  render();
})();
</script>
</body>
